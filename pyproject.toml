[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiesl"
version = "1.0.0"
description = "Fine-grained Internal Evidence Structure Learning for social bot detection"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "sympy>=1.13",
  "transformers>=4.40,<5",
  "safetensors>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
